<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Patch Preview</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f6f7f9;
      color: #1f2933;
    }
    body {
      margin: 0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid #d8dee7;
      background: #ffffff;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }
    .status {
      min-height: 20px;
      color: #52606d;
      font-size: 13px;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 74px);
      box-sizing: border-box;
    }
    section {
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #ffffff;
      border: 1px solid #d8dee7;
      border-radius: 6px;
      overflow: hidden;
    }
    h2 {
      margin: 0;
      padding: 12px 14px;
      font-size: 14px;
      border-bottom: 1px solid #d8dee7;
      background: #fbfcfd;
    }
    .editor {
      flex: 1;
      min-height: 320px;
    }
    .ql-container {
      border: 0 !important;
      font-size: 15px;
    }
    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        height: auto;
      }
      section {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Knowledge Patch Preview</h1>
    <div class="status" id="status"></div>
  </header>
  <main>
    <section>
      <h2>Before</h2>
      <div id="before" class="editor"></div>
    </section>
    <section>
      <h2>After</h2>
      <div id="after" class="editor"></div>
    </section>
  </main>
  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script>
    const before = new Quill("#before", { theme: "snow", readOnly: true, modules: { toolbar: false } });
    const after = new Quill("#after", { theme: "snow", readOnly: true, modules: { toolbar: false } });
    const statusEl = document.getElementById("status");

    function decodePayload(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64.padEnd(base64.length + (4 - base64.length % 4) % 4, "=");
      const bytes = Uint8Array.from(atob(padded), char => char.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function deltaText(delta) {
      if (!delta || !Array.isArray(delta.ops)) return "";
      return delta.ops.map(op => typeof op.insert === "string" ? op.insert : "").join("");
    }

    function applyOps(text, ops) {
      let cursor = 0;
      let output = "";
      for (const op of ops || []) {
        if (Number.isInteger(op.retain)) {
          output += text.slice(cursor, cursor + op.retain);
          cursor += op.retain;
        } else if (Number.isInteger(op.delete)) {
          cursor += op.delete;
        } else if (typeof op.insert === "string") {
          output += op.insert;
        }
      }
      return output + text.slice(cursor);
    }

    try {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("delta");
      if (!encoded) {
        statusEl.textContent = "Add ?delta=base64json to preview a patch.";
      } else {
        const payload = decodePayload(encoded);
        const oldDelta = payload.old_delta || { ops: [] };
        const oldText = deltaText(oldDelta);
        const newDelta = payload.new_delta || { ops: [{ insert: applyOps(oldText, payload.patch_ops) }] };
        before.setContents(oldDelta);
        after.setContents(newDelta);
        statusEl.textContent = "Loaded patch preview.";
      }
    } catch (error) {
      statusEl.textContent = `Failed to load preview: ${error.message}`;
    }
  </script>
</body>
</html>
